[project]
name = "onetwo"
description = "LLM Orchestration Library by Google DeepMind."
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [{name = "OneTwo Authors", email="no-reply@google.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
keywords = []

# pip dependencies of the project.
dependencies = [
    "absl-py",
    "aenum",
    "bs4",
    "anthropic",
    "dataclasses-json",
    "datasets",
    "tensorflow-datasets",
    "etils[epath]",
    "fastapi",
    # `mcp` and `fastmcp` are capped below the next major version on purpose.
    # fastmcp 3 drops the `fastmcp.client.transports.ClientSession` re-export
    # and mcp 2 renames `FastMCP` to `MCPServer`, both of which this package
    # still uses. The caps also keep an installed OneTwo on the same versions
    # that this package is developed and tested against internally.
    "fastmcp>=2.12,<3",
    "ffmpeg-python",  # For `stdlib/retrieval/video_chunking.py` (needs ffmpeg).
    "freezegun",
    # Note: there is a PYPI `gemma` library, which is not what we want.
    "gemma@git+https://github.com/google-deepmind/gemma.git",
    "google-cloud-aiplatform",
    "html5lib",
    "immutabledict",
    "importlib-resources",
    "jinja2",
    "mcp>=1.26,<2",  # See the note on the `fastmcp` cap above.
    "networkx",
    "numpy",
    "openai",
    "ollama",
    "pillow",
    "pydantic>=2.0",
    "pydub",  # For `stdlib/retrieval/audio_chunking.py` (needs ffmpeg).
    # `pydub` imports `audioop`, which was removed from the stdlib in 3.13.
    "audioop-lts",
    "pypdf",  # For `stdlib/retrieval/pdf_chunking.py`.
    "pytest",
    "portpicker",  # For `backends/onetwo_api_test_script.sh`.
    "pyyaml",  # For `import yaml`.
    "termcolor",
    "tqdm",
    "typing_extensions",
    "uvicorn",
]

# This is set automatically by flit using `onetwo.__version__`.
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/google-deepmind/onetwo"
repository = "https://github.com/google-deepmind/onetwo"

[project.optional-dependencies]
# Installed through `pip install '.[gemini_legacy]'`, only needed by the
# deprecated `backends/gemini_api.py` (prefer `backends/google_genai_api.py`).
# Not a default dependency: it caps protobuf below 6, which breaks
# `tensorflow-datasets` with tensorflow-metadata>=1.21 (built for protobuf>=6.31
# without declaring it), hence the tensorflow-metadata cap here.
gemini_legacy = [
    "google-generativeai",
    "tensorflow-metadata<1.21",
]

# Installed through `pip install '.[dev]'`.
dev = [
    "pytest-xdist",
    "pylint>=2.6.0",
    "pyink",
]

# Installed through `pip install '.[docs]'`.
docs = [
    # Install `apitree` with all extensions (sphinx, theme,...)
    "sphinx-apitree[ext]",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pyink]
# Formatting configuration to follow Google style-guide.
line-length = 80
preview = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools, ...). All backends are supported by `pip install`.
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
# Flit specific options (files to exclude from the PyPI package).
# If using another build backend (setuptools, poetry), you can remove this
# section.
exclude = [
  # Do not release tests files on PyPI.
  "**/*_test.py",
]
